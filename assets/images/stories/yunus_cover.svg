      <stop offset="0%" stop-color="#1D6FA5"/>
      <stop offset="100%" stop-color="#4FB3E8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#sea)"/>

  <!-- moon -->
  <circle cx="320" cy="75" r="30" fill="#FFF8EE" opacity="0.9"/>

  <!-- bubbles -->
