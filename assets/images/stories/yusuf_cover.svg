<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="night" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B3A6B"/>
      <stop offset="100%" stop-color="#4FB3E8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#night)"/>

  <!-- sun -->
  <circle cx="130" cy="150" r="40" fill="#FFC94A"/>

  <!-- moon (crescent) -->
  <circle cx="270" cy="130" r="34" fill="#FFF8EE"/>
  <circle cx="284" cy="117" r="30" fill="#1B3A6B"/>

  <!-- 11 stars, referencing the dream in Surat Yusuf -->
  <g fill="#FFFFFF">
    <circle cx="60" cy="80" r="5"/>
    <circle cx="100" cy="250" r="5"/>
    <circle cx="150" cy="305" r="6"/>
    <circle cx="200" cy="90" r="4"/>
    <circle cx="230" cy="265" r="5"/>
    <circle cx="280" cy="225" r="6"/>
    <circle cx="320" cy="90" r="5"/>
    <circle cx="340" cy="275" r="5"/>
    <circle cx="40" cy="185" r="4"/>
    <circle cx="360" cy="165" r="5"/>
    <circle cx="180" cy="345" r="5"/>
  </g>
</svg>
