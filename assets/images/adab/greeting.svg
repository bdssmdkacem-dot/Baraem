<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
<rect width="400" height="400" fill="#FFEDE5"/>

  <!-- two small paw waves + heart -->
  <circle cx="130" cy="110" r="24" fill="#FF8A65"/>
  <circle cx="270" cy="110" r="24" fill="#4FB3E8"/>
  <path d="M200 130 C185 110 150 115 155 145 C158 170 200 190 200 190 C200 190 242 170 245 145 C250 115 215 110 200 130 Z" fill="#FFC94A"/>
  <circle cx="90" cy="80" r="6" fill="#FF8A65" opacity="0.7"/>
  <circle cx="310" cy="80" r="6" fill="#4FB3E8" opacity="0.7"/>


  <!-- mane -->
  <g fill="#FFC94A">
    <circle cx="200" cy="205" r="38"/>
    <circle cx="150" cy="225" r="33"/>
    <circle cx="250" cy="225" r="33"/>
    <circle cx="130" cy="270" r="29"/>
    <circle cx="270" cy="270" r="29"/>
    <circle cx="150" cy="315" r="28"/>
    <circle cx="250" cy="315" r="28"/>
    <circle cx="200" cy="335" r="30"/>
  </g>
  <!-- ears -->
  <circle cx="150" cy="213" r="18" fill="#FFE3B0"/>
  <circle cx="250" cy="213" r="18" fill="#FFE3B0"/>
  <circle cx="150" cy="215" r="9" fill="#FF8A65"/>
  <circle cx="250" cy="215" r="9" fill="#FF8A65"/>
  <!-- head -->
  <circle cx="200" cy="270" r="80" fill="#FFE3B0"/>
  <!-- cheeks -->
  <circle cx="162" cy="292" r="10" fill="#FF8A65" opacity="0.45"/>
  <circle cx="238" cy="292" r="10" fill="#FF8A65" opacity="0.45"/>
  <!-- eyes -->
  <circle cx="175" cy="268" r="10" fill="#3A2E2A"/>
  <circle cx="225" cy="268" r="10" fill="#3A2E2A"/>
  <circle cx="178" cy="264" r="3.3" fill="#FFFFFF"/>
  <circle cx="228" cy="264" r="3.3" fill="#FFFFFF"/>
  <!-- nose -->
  <ellipse cx="200" cy="288" rx="9" ry="6" fill="#3A2E2A"/>
  <!-- mouth -->
  <path d="M200 294 Q200 305 186 307" stroke="#3A2E2A" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M200 294 Q200 305 214 307" stroke="#3A2E2A" stroke-width="3.5" fill="none" stroke-linecap="round"/>

</svg>
