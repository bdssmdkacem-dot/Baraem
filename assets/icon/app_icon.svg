      <stop offset="0%" stop-color="#3DC9A0"/>
      <stop offset="100%" stop-color="#4FB3E8"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="220" fill="url(#bg)"/>

