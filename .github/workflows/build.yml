name: Build Baraem APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Restore Android project
        run: |
          set -e
          if [ ! -d "android/app" ]; then
            flutter create --platforms=android --org com.baraem --project-name baraem --no-pub .
          fi
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
          test -f android/settings.gradle || test -f android/settings.gradle.kts

      - name: Validate asset directories
        run: |
          set -e
          for dir in assets/images/icon assets/images/mascot assets/images/stories assets/images/adab assets/audio/adkar assets/audio/stories; do
            test -d "$dir"
          done

      - name: Remove generated Flutter test
        run: rm -f test/widget_test.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: baraem-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
