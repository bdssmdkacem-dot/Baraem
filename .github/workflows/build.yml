name: Build Baraem APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Restore Android project
        run: |
          set -e
          if [ ! -d "android/app" ]; then
            flutter create --platforms=android --org com.baraem --project-name baraem --no-pub .
          fi

          test -f android/app/build.gradle.kts
          test -f android/settings.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/kotlin/com/baraem/baraem/MainActivity.kt

          # Keep the Android NDK aligned with the current Flutter plugins.
          sed -i 's/ndkVersion = flutter.ndkVersion/ndkVersion = "27.0.12077973"/' android/app/build.gradle.kts

      - name: Validate source fixes
        run: |
          set -e
          grep -F 'setState(() => _quizFinished = true);' lib/screens/story_detail_screen.dart
          grep -F 'AudioProvider? _audioProvider;' lib/screens/friends_challenge_screen.dart
          grep -F '_audioProvider?.stop();' lib/screens/friends_challenge_screen.dart

      - name: Commit Android project to GitHub
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android .metadata
          if git diff --cached --quiet; then
            echo "Android project already tracked."
          else
            git commit -m "android: add Flutter Android project"
            git push origin HEAD:main
          fi

      - name: Validate asset directories
        run: |
          set -e
          for dir in assets/icon assets/images/mascot assets/images/stories assets/images/adab assets/images/home assets/audio/adkar assets/audio/stories; do
            test -d "$dir"
          done

      - name: Remove generated Flutter test
        run: rm -f test/widget_test.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: baraem-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
