name: Build Baraem APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      - name: Create Android project
        run: |
          if [ ! -d "android" ]; then
            flutter create \
              --platforms=android \
              --org com.baraem \
              --project-name baraem \
              .
          fi

          test -d android/app

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: baraem-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
