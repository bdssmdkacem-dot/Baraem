name: baraem
description: "براعم - تطبيق تعليم القيم الإسلامية للأطفال (أذكار، قصص الأنبياء، آداب)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  audioplayers: ^6.0.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  lottie: ^3.1.2
  confetti: ^0.7.0
  in_app_purchase: ^3.2.0
  google_mobile_ads: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/icon/
    - assets/images/mascot/
    - assets/images/stories/
    - assets/images/adab/
    - assets/audio/adkar/
    - assets/audio/stories/
