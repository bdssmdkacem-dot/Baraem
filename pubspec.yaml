name: baraem
description: "براعم - تطبيق تعليم القيم الإسلامية للأطفال (أذكار، قصص الأنبياء، آداب)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  audioplayers: ^6.0.0
  confetti: ^0.7.0
  in_app_purchase: ^3.2.0
  # google_mobile_ads retiré : jamais utilisé côté Dart.
  # flutter_svg retiré : les illustrations sont maintenant des assets raster.
  # google_fonts retiré : aucune police distante n'est nécessaire.
  # lottie retiré : aucun fichier Lottie n'est utilisé.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

