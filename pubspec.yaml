name: baraem
description: "براعم - تطبيق تعليم القيم الإسلامية للأطفال (أذكار، قصص الأنبياء، آداب)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management (même pattern que Aqim / Kadd / Sufra)
  provider: ^6.1.2

  # Persistance locale (streak, étoiles, contenu débloqué)
  shared_preferences: ^2.2.3

  # Audio (dhikr, narration des histoires)
  audioplayers: ^6.0.0

  # Polices arabes (Google Fonts, embarquées offline via pubspec)
  google_fonts: ^6.2.1

  # Illustrations vectorielles (mascotte, couvertures d'histoires)
  flutter_svg: ^2.0.10

  # Animations légères (étoiles, confettis de récompense)
  lottie: ^3.1.2
  confetti: ^0.7.0

  # Monétisation freemium
  in_app_purchase: ^3.2.0

  # Ads (optionnel, si tu gardes un bandeau gratuit hors zones premium)
  google_mobile_ads: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Génère les icônes de lanceur Android/iOS depuis assets/icon/app_icon.png
  # Lance : flutter pub run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/icon/
    - assets/images/mascot/
    - assets/images/stories/
    - assets/images/adab/
    - assets/audio/adkar/
    - assets/audio/stories/

  fonts:
    - family: BalooArabic
      fonts:
        - asset: assets/fonts/BalooBhaijaan2-Regular.ttf
          weight: 400
        - asset: assets/fonts/BalooBhaijaan2-Bold.ttf
          weight: 700
        - asset: assets/fonts/BalooBhaijaan2-ExtraBold.ttf
          weight: 800
